[package]
name = "lnu-elytra"
version = "0.0.8"
edition = "2024"

license = "AGPL-3.0"
repository = "https://github.com/mcitem/lnuElytra"
description = "LNU 岭南师范学院 正方教务系统 抢课 选课工具"

include = ["/src/**/*", "/LICENSE"]

[lib]
name = "lnu_elytra"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# default = ["tracing", "blocking", "__pyo3", "cookie_override"]
blocking = ["dep:tokio"]
cookie_override = []
reqwest_cookie_store = ["dep:reqwest_cookie_store"]
tracing = ["dep:tracing"]
__pyo3 = [
    "dep:pyo3",
    "dep:pyo3-tracing-subscriber",
    "dep:pyo3-async-runtimes",
    "blocking",
    "cookie_override",
]
__flutter = ["dep:delegate"]

[dependencies]
url = { version = "2.5.8" }
delegate = { version = "0.13.5", optional = true }

thiserror = "2.0.18"

hex = "0.4.3"
rsa = "0.9.10"
rand = "0.8.5"
base64 = "0.22.1"

serde = { version = "1.0.228", features = ["derive"] }
scraper = { version = "0.27.0", features = ["atomic"] }
reqwest = { version = "0.13.4", features = [
    "cookies",
    "form",
    "json",
    "query",
    "rustls",
], default-features = false }
reqwest_cookie_store = { version = "0.10.0", optional = true }

tokio = { version = "1.52.3", optional = true, features = ["rt-multi-thread"] }

pyo3 = { version = "0.27", optional = true }
pyo3-tracing-subscriber = { version = "0.4.0", features = [
    "stubs",
], optional = true }
pyo3-async-runtimes = { version = "0.27", features = [
    "attributes",
    "tokio-runtime",
], optional = true }

tracing = { version = "0.1.44", optional = true }


[dev-dependencies]
env_logger = { version = "0.11.10" }
pyo3-stub-gen = { version = "0.22.3" }


[workspace]
resolver = "3"
members = [".", "./examples", "./mock"]
dependencies = { "lnu-elytra" = { path = "." } }
