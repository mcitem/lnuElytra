[package]
name = "lnu-elytra-examples"
version = "0.1.0"
edition = "2024"

[dependencies]
lnu-elytra = { features = [
    "tracing",
    "blocking",
    "converter",
    "reqwest_cookie_store",
], workspace = true }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
